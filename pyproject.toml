[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proven"
version = "1.0.0"
description = "Proven — Graph-guided, runtime-proven, and mutation-verified test quality gate for AI Coding Agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["testing", "graph", "llm", "code-intelligence", "pytest", "gnn"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "networkx>=3.0",
    "pandas>=2.0",
    "numpy",
    "gitpython>=3.1",
    "thefuzz[speedup]",
    "unidecode",
    "tqdm",
    "python-igraph",
    "requests",
    "pytest",
    "pytest-cov",
]

[project.optional-dependencies]
gnn = [
    "torch>=2.0",
    "torch-geometric",
    "sentence-transformers>=2.0",
    "scikit-learn",
]
llm = [
    "google-generativeai>=0.8",
    "openai>=1.0",
]
all = [
    "proven[gnn]",
    "proven[llm]",
]

[project.scripts]
proven = "proven.cli:cli"
softgnn = "proven.cli:cli"

[project.urls]
Homepage = "https://github.com/minhquang0407/proven"
Repository = "https://github.com/minhquang0407/proven"
Issues = "https://github.com/minhquang0407/proven/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["proven*", "softgnn_advisor*"]

[tool.setuptools.package-data]
"proven" = ["py.typed"]
"softgnn_advisor" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".git", ".venv", "skills", "build", "dist", "data"]

