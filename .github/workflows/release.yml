name: Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: proven
            asset: proven-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: proven
            asset: proven-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: proven
            asset: proven-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: proven.exe
            asset: proven-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          chmod +x proven-linux-x86_64 proven-macos-aarch64 proven-macos-x86_64
          sha256sum proven-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prune superseded GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTIVE_TAGS=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags" --paginate --jq '.[].ref | sub("^refs/tags/"; "")' || true)
          for rel_tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$rel_tag" = "${GITHUB_REF_NAME}" ] || ! printf '%s\n' "$ACTIVE_TAGS" | grep -Fxq "$rel_tag"; then
              echo "Removing superseded release: $rel_tag"
              gh release delete "$rel_tag" --yes || true
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/proven-*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
